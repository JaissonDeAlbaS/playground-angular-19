@if (visible()) {
  <div
    class="modal-overlay fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-50 p-4"
    (click)="onOverlayClick($event)"
    (keydown)="onKeydown($event)"
    tabindex="0"
  >
    <div class="bg-slate-800 rounded-xl shadow-modal border border-slate-700 w-full max-w-lg max-h-[90vh] overflow-hidden">
      @if (title()) {
        <div class="px-6 py-4 border-b border-slate-700">
          <h2 class="text-xl font-semibold text-slate-100">{{ title() }}</h2>
        </div>
      }
      <div class="p-6 overflow-y-auto">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
}
