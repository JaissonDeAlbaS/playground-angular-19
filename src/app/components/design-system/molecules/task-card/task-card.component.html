<app-card [hoverable]="true" class="group">
  <div class="flex items-start justify-between mb-2">
    <div class="flex items-center gap-2">
      @if (statusColor()) {
        <div
          class="w-2.5 h-2.5 rounded-full shadow-lg"
          [style.backgroundColor]="statusColor()"
          [style.boxShadow]="'0 0 8px ' + statusColor()"
        ></div>
      }
      <h4 class="text-sm font-medium text-slate-100 line-clamp-2">{{ task().title }}</h4>
    </div>

    <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-smooth">
      <button
        (click)="onEdit()"
        class="p-1 text-slate-400 hover:text-emerald-400 transition-smooth rounded"
        title="Editar"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
      </button>
      <button
        (click)="onDelete()"
        class="p-1 text-slate-400 hover:text-red-400 transition-smooth rounded"
        title="Eliminar"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
      </button>
    </div>
  </div>

  @if (task().description) {
    <p class="text-xs text-slate-400 mb-3 line-clamp-2">{{ task().description }}</p>
  }

  <div class="flex items-center justify-between mt-auto pt-2 border-t border-slate-700/50">
    <div class="flex items-center gap-2">
      @if (task().dueDate) {
        <span [class]="getDueDateClasses()">
          <svg class="inline w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
          {{ formatDate(task().dueDate) }}
        </span>
      }
    </div>

    <app-badge
      [color]="task().status === 'done' ? 'emerald' : task().status === 'in-progress' ? 'amber' : 'red'"
      [text]="task().status === 'done' ? 'Completado' : task().status === 'in-progress' ? 'En progreso' : 'Por hacer'"
    ></app-badge>
  </div>
</app-card>
