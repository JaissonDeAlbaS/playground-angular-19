<div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 p-4 md:p-8">
  <!-- Header -->
  <header class="text-center mb-8">
    <h1 class="text-3xl md:text-4xl font-bold text-white tracking-tight mb-2">Tablero Kanban</h1>
    <p class="text-slate-400 text-sm md:text-base">Organiza tus tareas arrastrando entre columnas</p>
  </header>

  <!-- Columns Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6 max-w-7xl mx-auto">
    @for (column of columns; track column.id) {
      <div 
        class="column-wrapper"
        (dragover)="onDragOver($event)"
        (drop)="onDrop($event, column.status)"
      >
        <!-- Column Header -->
        <div class="rounded-t-xl px-4 py-3 flex items-center justify-between"
             [ngClass]="getColumnHeaderClass(column.status)">
          <div class="flex items-center gap-3">
            <app-badge 
              [text]="''" 
              [color]="column.status === 'done' ? 'emerald' : column.status === 'in-progress' ? 'amber' : 'red'"
              class="!p-0 !w-3 !h-3"
            ></app-badge>
            <h2 class="font-semibold text-white text-sm md:text-base">{{ column.title }}</h2>
          </div>
          <span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-700/50 text-slate-300">
            {{ getTasksForColumn(column.status).length }}
          </span>
        </div>

        <!-- Tasks Container -->
        <div class="bg-slate-800/50 rounded-b-xl p-3 min-h-[400px] flex flex-col gap-3 border-t border-slate-700/50">
          @for (task of getTasksForColumn(column.status); track task.id) {
            <app-task-card 
              [task]="task"
              [statusColor]="getColumnColor(column.status)"
              (edit)="openEditModal(task)"
              (delete)="deleteTask(task.id)"
              class="cursor-grab active:cursor-grabbing"
              draggable="true"
              (dragstart)="onDragStart($event, task.id)"
            ></app-task-card>
          } @empty {
            <div class="flex-1 flex items-center justify-center py-8">
              <div class="text-center">
                <div class="w-12 h-12 mx-auto mb-3 rounded-full bg-slate-700/30 flex items-center justify-center">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 00-.707.293h-3.172a1 1 0 00-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
                  </svg>
                </div>
                <p class="text-slate-500 text-sm">No hay tareas</p>
              </div>
            </div>
          }
        </div>
      </div>
    }
  </div>

  <!-- Modal -->
  @if (showModal()) {
    <app-task-form 
      [task]="editingTask()"
      (save)="onSaveTask($event)"
      (cancel)="closeModal()"
    />
  }

  <!-- Floating Action Button -->
  <app-button 
    variant="primary"
    size="fab"
    (click)="openCreateModal()"
    class="fixed bottom-6 right-6 z-50 hover:scale-110 transition-transform duration-200"
    aria-label="Nueva Tarea"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
    </svg>
  </app-button>
</div>
