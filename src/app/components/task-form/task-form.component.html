<div
  class="modal-overlay fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm"
  [class.opacity-0]="!isVisible()"
  [class.opacity-100]="isVisible()"
  [class.pointer-events-none]="!isVisible()"
  (click)="onOverlayClick($event)"
  (keydown)="onKeydown($event)"
  tabindex="-1"
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="'modal-title'"
>
  <div
    class="modal-content w-full max-w-md bg-slate-800 rounded-xl shadow-2xl border border-slate-700 overflow-hidden"
    [class.scale-95]="!isVisible()"
    [class.scale-100]="isVisible()"
    [class.opacity-0]="!isVisible()"
    [class.opacity-100]="isVisible()"
    [class.translate-y-4]="!isVisible()"
    [class.translate-y-0]="isVisible()"
    transition-style="in:custom:n quarters"
  >
    <!-- Header -->
    <div class="modal-header flex items-center justify-between px-6 py-4 border-b border-slate-700">
      <h2 id="modal-title" class="text-lg font-semibold text-white">
        @if (isEditMode()) {
          <span>Editar Tarea</span>
        } @else {
          <span>Nueva Tarea</span>
        }
      </h2>
      <app-button
        variant="ghost"
        size="sm"
        (click)="onCancel()"
        aria-label="Cerrar modal"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </app-button>
    </div>

    <!-- Form -->
    <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" class="modal-body px-6 py-5 space-y-5">
      <!-- Title Field -->
      <app-form-field
        label="Título"
        [required]="true"
        [error]="isFieldInvalid('title') ? getErrorMessage('title') : ''"
        for="title"
      >
        <app-input
          id="title"
          type="text"
          formControlName="title"
          placeholder="Ej: Implementar login con OAuth"
        ></app-input>
      </app-form-field>

      <!-- Description Field -->
      <app-form-field
        label="Descripción"
        for="description"
      >
        <textarea
          id="description"
          formControlName="description"
          placeholder="Describe los detalles de la tarea..."
          rows="3"
          class="w-full px-3 py-2 bg-slate-800 border border-slate-600 rounded-lg text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-smooth resize-none"
        ></textarea>
      </app-form-field>

      <!-- Status Field -->
      <app-form-field
        label="Estado"
        for="status"
      >
        <select
          id="status"
          formControlName="status"
          class="w-full px-3 py-2 bg-slate-800 border border-slate-600 rounded-lg text-slate-100 transition-smooth focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent cursor-pointer appearance-none"
          style="background-image: url('data:image/svg+xml;charset=UTF-8,%3csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%2394a3b8%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3e%3cpolyline points=%276 9 12 15 18 9%27%3e%3c/polyline%3e%3c/svg%3e'); background-repeat: no-repeat; background-position: right 0.75rem center; background-size: 1.25rem;"
        >
          <option value="todo">Por hacer</option>
          <option value="in-progress">En progreso</option>
          <option value="done">Completado</option>
        </select>
      </app-form-field>

      <!-- Due Date Field -->
      <app-form-field
        label="Fecha límite"
        for="dueDate"
      >
        <app-input
          id="dueDate"
          type="date"
          formControlName="dueDate"
        ></app-input>
      </app-form-field>

      <!-- Form Actions -->
      <div class="form-actions flex items-center justify-end gap-3 pt-2">
        <app-button
          variant="secondary"
          type="button"
          (click)="onCancel()"
        >
          Cancelar
        </app-button>
        <app-button
          variant="primary"
          type="submit"
          [disabled]="taskForm.invalid"
        >
          {{ isEditMode() ? 'Actualizar' : 'Crear' }}
        </app-button>
      </div>
    </form>
  </div>
</div>
